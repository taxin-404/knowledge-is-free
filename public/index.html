<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge is Free — PDF Archive</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <span class="mark">§</span>
      <h1>Knowledge is Free</h1>
      <span class="tagline">a private archive of documents</span>
    </div>
  </header>

  <main>
    <section class="intake" aria-label="Upload a document">
      <label for="file-input" class="dropzone" id="dropzone">
        <span class="dz-label">Drop a PDF here, or click to choose one</span>
        <span class="dz-sub">Only .pdf files are accepted</span>
        <input type="file" id="file-input" accept="application/pdf" hidden>
      </label>
      <div class="progress" id="progress" hidden>
        <div class="progress-bar" id="progress-bar"></div>
        <span id="progress-label">Filing...</span>
      </div>
    </section>

    <section class="catalog" aria-label="Book shelf">
      <div class="catalog-head">
        <h2>Shelf</h2>
        <span class="count" id="count">0 documents</span>
      </div>
      <div class="shelf" id="shelf"></div>
      <p class="empty" id="empty" hidden>Nothing filed yet. Add your first document above.</p>
    </section>
  </main>

  <div class="reader" id="reader">
    <div class="reader-bar">
      <span id="reader-title">Document</span>
      <div class="reader-actions">
        <button id="reader-close" aria-label="Close reader">Close</button>
      </div>
    </div>
    <iframe id="reader-frame" title="PDF viewer"></iframe>
  </div>

  <script src="app.js"></script>
</body>
</html>
